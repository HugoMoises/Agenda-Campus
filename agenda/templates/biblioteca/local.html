{% extends 'base.html' %}
{% block content %}
    <h1> {{local.nome}} </h1>
    <h2>Capacidade: {{local.capacidade}}</h2>
    <h3>Eventos neste local:</h3>
    <ul>
    {% for evento in local.eventos.all %}
        <li><a href="{% url 'detalhe_evento' evento.id %}">{{evento.titulo}}</a></li>
    {% endfor %}
    </ul>
{% endblock %}
